name: Flatpak

# Builds the Flatpak for both architectures from build-aux/us.priet.drtagger.json
# (offline: crates from build-aux/cargo-sources.json, FFmpeg, ONNX Runtime and
# the models pinned by sha256) and keeps the bundles as artifacts. A tag
# v* attaches them to a draft release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: build-aux/us.priet.drtagger.json
          bundle: drtagger-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'build-aux/*.json') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Draft release with the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
            --title "drtagger ${GITHUB_REF_NAME#v}" --notes "Flatpak bundles for x86_64 and aarch64." \
            bundles/*.flatpak
