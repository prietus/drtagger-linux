name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Arch has the GTK / libadwaita versions the app targets.
    container: archlinux:latest
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup gtk4 libadwaita blueprint-compiler \
            ffmpeg chromaprint cmake icu gettext
          rustup default stable
          # Pre-generated ICU bindings for the installed ICU major.
          echo "RUST_ICU_MAJOR_VERSION_NUMBER=$(pkg-config --modversion icu-i18n | cut -d. -f1)" >> "$GITHUB_ENV"
          rustup component add clippy rustfmt
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (offline)
        run: cargo test --workspace --locked
      - name: Settings schema
        run: glib-compile-schemas --strict --dry-run data
